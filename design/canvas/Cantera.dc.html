<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Onest:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "Onest", ui-sans-serif, system-ui, sans-serif; }
    a { color: #2f7d77; } a:hover { color: #215a56; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; padding: 26px 24px 24px; background: {{t.bg}}; color: {{t.ink}}; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="font-family: 'Familjen Grotesk', ui-sans-serif, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.025em; line-height: 1;">Estante</div>
    <div style="display: flex; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: {{t.raise}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; color: {{t.ink2}};">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 14px; background: {{t.raise}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; color: {{t.ink2}};">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"></path></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 11px; margin-top: 20px; height: 48px; padding: 0 16px; border-radius: 17px; background: {{t.raise}}; box-shadow: {{t.shadow}}; color: {{t.faint}};">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m15.8 15.8 4.7 4.7"></path></svg>
    <span style="font-size: 14.5px;">Buscar o abrir</span>
  </div>

  <div style="display: flex; gap: 7px; margin-top: 18px;">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <div style="height: 34px; display: flex; align-items: center; padding: 0 14px; border-radius: 11px; font-size: 13px; font-weight: 500; background: {{tab.bg}}; color: {{tab.color}};">{{tab.name}}</div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: {{gridCols}}; gap: 20px 16px; margin-top: 24px;">
    <sc-for list="{{apps}}" as="it" hint-placeholder-count="19">
      <div style="width: 100%; aspect-ratio: 1; border-radius: 22px; background: {{it.bg}}; display: flex; align-items: center; justify-content: center; color: {{it.glyph}}; box-shadow: {{t.tileShadow}};">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><use href="{{it.icon}}"></use></svg>
      </div>
    </sc-for>
    <div style="width: 100%; aspect-ratio: 1; border-radius: 22px; background: {{t.raise}}; box-shadow: {{t.tileShadow}}; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 15px;">
      <sc-for list="{{folderDots}}" as="d" hint-placeholder-count="4">
        <div style="border-radius: 7px; background: {{d.c}};"></div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; gap: 14px; padding: 14px; border-radius: 26px; background: {{t.raise}}; box-shadow: {{t.shadow}};">
    <sc-for list="{{dock}}" as="d" hint-placeholder-count="4">
      <div style="flex: 1; aspect-ratio: 1; border-radius: 19px; background: {{d.bg}}; display: flex; align-items: center; justify-content: center; color: {{d.glyph}};">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><use href="{{d.icon}}"></use></svg>
      </div>
    </sc-for>
  </div>

  <svg width="0" height="0" style="position: absolute;" aria-hidden="true"><defs>
    <symbol id="ca-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3.5v3M16 3.5v3"></path></symbol>
    <symbol id="ca-cloud" viewBox="0 0 24 24"><path d="M7.5 19a4.5 4.5 0 0 1-.4-9 6 6 0 0 1 11.5 1.6A3.9 3.9 0 0 1 17.5 19z"></path></symbol>
    <symbol id="ca-img" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m4.6 17.6 4.1-4.1a2 2 0 0 1 2.8 0l4.9 4.9"></path></symbol>
    <symbol id="ca-doc" viewBox="0 0 24 24"><path d="M6.5 3.5h7L19 9v10.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-14A1.5 1.5 0 0 1 6.5 3.5z"></path><path d="M13.4 3.6V9H19M8.5 13.5h7M8.5 17h5"></path></symbol>
    <symbol id="ca-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"></rect><path d="M10 8.9 15.6 12 10 15.1z"></path></symbol>
    <symbol id="ca-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.6 12h16.8M12 3.5c2.3 2.4 3.5 5.3 3.5 8.5S14.3 18.1 12 20.5c-2.3-2.4-3.5-5.3-3.5-8.5S9.7 5.9 12 3.5z"></path></symbol>
    <symbol id="ca-pen" viewBox="0 0 24 24"><path d="m5 19 1.1-4.1L16.6 4.4a2.1 2.1 0 0 1 3 3L9.1 17.9z"></path><path d="m14.6 6.4 3 3"></path></symbol>
    <symbol id="ca-tv" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7"></path></symbol>
    <symbol id="ca-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></symbol>
    <symbol id="ca-list" viewBox="0 0 24 24"><path d="M9 7h10.5M9 12h10.5M9 17h6.5"></path><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"></path></symbol>
    <symbol id="ca-chat" viewBox="0 0 24 24"><path d="M20 12.2c0 3.7-3.6 6.7-8 6.7a9.6 9.6 0 0 1-2.6-.35L5 20l1.1-3.2A6.3 6.3 0 0 1 4 12.2C4 8.5 7.6 5.5 12 5.5s8 3 8 6.7z"></path></symbol>
    <symbol id="ca-code" viewBox="0 0 24 24"><path d="m9 8.4-4.2 3.7L9 15.8M15 8.4l4.2 3.7L15 15.8"></path></symbol>
    <symbol id="ca-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3.9 7.4 7 5a2 2 0 0 0 2.2 0l7-5"></path></symbol>
    <symbol id="ca-spark" viewBox="0 0 24 24"><path d="M12 3.5c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"></path></symbol>
    <symbol id="ca-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-6 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15 12 21 12 21z"></path><circle cx="12" cy="10.5" r="2.4"></circle></symbol>
    <symbol id="ca-music" viewBox="0 0 24 24"><path d="M9 17.3V6.9l10-2v10.2"></path><ellipse cx="6.5" cy="17.6" rx="2.5" ry="2.1"></ellipse><ellipse cx="16.5" cy="15.4" rx="2.5" ry="2.1"></ellipse></symbol>
    <symbol id="ca-film" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect><path d="M8 4.5v15M16 4.5v15M3 12h18"></path></symbol>
    <symbol id="ca-cart" viewBox="0 0 24 24"><path d="M3 4.5h2.3l2.2 9.6a1.8 1.8 0 0 0 1.8 1.4h7a1.8 1.8 0 0 0 1.8-1.4L20.5 8H6.2"></path><circle cx="10" cy="19.2" r="1.4"></circle><circle cx="17" cy="19.2" r="1.4"></circle></symbol>
  </defs></svg>

</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"cols":{"editor":"int","default":4,"min":3,"max":5,"section":"Cuadrícula"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const cols = this.props.cols ?? 4;
    const t = dark
      ? { bg: '#191816', ink: '#F0EDE7', ink2: '#B6AFA5', faint: '#807A70', raise: '#242220',
          base: '#242220', shadow: '0 2px 10px rgba(0,0,0,0.34)', tileShadow: '0 2px 8px rgba(0,0,0,0.28)', pill: '#332F2A' }
      : { bg: '#F4F2EE', ink: '#23211D', ink2: '#57524A', faint: '#9C958B', raise: '#FFFFFF',
          base: '#FFFFFF', shadow: '0 2px 12px rgba(40,34,24,0.07)', tileShadow: '0 1px 4px rgba(40,34,24,0.05)', pill: '#E6E2DA' };

    const wash = c => 'color-mix(in oklab, ' + c + ' ' + (dark ? 24 : 17) + '%, ' + t.base + ')';
    const glyph = c => dark
      ? 'color-mix(in oklab, ' + c + ' 58%, #F0EDE7)'
      : 'color-mix(in oklab, ' + c + ' 84%, #23211D)';
    const app = (icon, c) => ({ icon: '#ca-' + icon, bg: wash(c), glyph: glyph(c) });

    const apps = [
      app('cal', '#2F6FD0'), app('cloud', '#3D8BFD'), app('img', '#E4572E'), app('doc', '#D9A116'),
      app('play', '#C4302B'), app('globe', '#1F7AE0'), app('pen', '#6965DB'), app('tv', '#00897B'),
      app('grid', '#1E8E3E'), app('doc', '#6B6B6B'), app('grid', '#0079BF'), app('chat', '#7C3E7E'),
      app('list', '#5E6AD2'), app('code', '#2F80ED'), app('music', '#1DB954'), app('film', '#E50914'),
      app('cart', '#E08A00'), app('code', '#3A3F45'), app('pen', '#A259FF')
    ];
    const dock = [
      app('mail', '#D14836'), app('chat', '#1FA855'), app('spark', '#C96442'), app('pin', '#1A9E5F')
    ];
    const tabs = [
      { name: 'Diario', bg: t.ink, color: t.bg },
      { name: 'Crear', bg: t.pill, color: t.ink2 },
      { name: 'Ocio', bg: t.pill, color: t.ink2 }
    ];
    const folderDots = ['#6B6B6B', '#7C3E7E', '#5E6AD2', '#00897B'].map(c => ({ c: 'color-mix(in oklab, ' + c + ' ' + (dark ? 52 : 38) + '%, ' + t.base + ')' }));

    return { t, apps, dock, tabs, folderDots, gridCols: 'repeat(' + cols + ', minmax(0, 1fr))' };
  }
}
</script>
</body>
</html>
