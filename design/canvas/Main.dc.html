<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Onest:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "Onest", ui-sans-serif, system-ui, sans-serif; }
    a { color: #2f7d77; } a:hover { color: #215a56; }
    * { box-sizing: border-box; }
    @keyframes dc-blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; padding: 26px 24px 24px; background: {{t.bg}}; color: {{t.ink}}; overflow: hidden;">

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; opacity: {{ui.contentOpacity}}; transform: {{ui.contentScale}}; transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.2, 0.8, 0.25, 1);">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px;">
      <div style="font-family: 'Familjen Grotesk', ui-sans-serif, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.025em; line-height: 1;">Estante</div>
      <div style="display: flex; gap: 8px;">
        <div style="width: 44px; height: 44px; border-radius: 14px; background: {{t.raise}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; color: {{t.ink2}};">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
        <div onClick="{{openSettings}}" style="width: 44px; height: 44px; border-radius: 14px; background: {{ui.gearBg}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; color: {{ui.gearInk}}; cursor: pointer;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"></path></svg>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 7px; margin-top: 18px;">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
        <div style="height: 44px; display: flex; align-items: center; padding: 0 17px; border-radius: 14px; font-size: 13.5px; font-weight: 500; background: {{tab.bg}}; color: {{tab.color}};">{{tab.name}}</div>
      </sc-for>
    </div>

    <sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: {{gridCols}}; gap: {{ui.rowGap}} 16px; margin-top: 22px;">
        <sc-for list="{{apps}}" as="it" hint-placeholder-count="19">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div style="width: 100%; max-width: 76px; aspect-ratio: 1; border-radius: 22px; background: {{it.bg}}; display: flex; align-items: center; justify-content: center; color: {{it.glyph}}; box-shadow: {{t.tileShadow}};">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><use href="{{it.icon}}"></use></svg>
            </div>
            <div style="display: {{ui.labelDisplay}}; font-size: 10.5px; line-height: 1.2; color: {{t.ink2}}; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{it.name}}</div>
          </div>
        </sc-for>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div style="width: 100%; max-width: 76px; aspect-ratio: 1; border-radius: 22px; background: {{t.raise}}; box-shadow: {{t.tileShadow}}; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 15px;">
            <sc-for list="{{folderDots}}" as="d" hint-placeholder-count="4">
              <div style="border-radius: 7px; background: {{d.c}};"></div>
            </sc-for>
          </div>
          <div style="display: {{ui.labelDisplay}}; font-size: 10.5px; line-height: 1.2; color: {{t.ink2}};">Trabajo</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top: 20px; display: flex; flex-direction: column;">
        <sc-for list="{{groups}}" as="gr" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column;">
            <div style="display: flex; align-items: baseline; justify-content: space-between; height: 28px;">
              <div style="font-family: 'Familjen Grotesk', ui-sans-serif, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.faint}};">{{gr.name}}</div>
              <div style="font-size: 11px; color: {{t.faint}};">{{gr.count}}</div>
            </div>
            <sc-for list="{{gr.rows}}" as="it" hint-placeholder-count="5">
              <div style="display: flex; align-items: center; gap: 13px; height: 52px;">
                <div style="width: 38px; height: 38px; flex: 0 0 auto; border-radius: 13px; background: {{it.bg}}; display: flex; align-items: center; justify-content: center; color: {{it.glyph}};">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="{{it.icon}}"></use></svg>
                </div>
                <div style="flex: 1; min-width: 0; font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{it.name}}</div>
                <div style="font-size: 11px; color: {{t.faint}};">{{it.host}}</div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 122px; z-index: 4; padding: 8px; border-radius: 22px; background: {{t.raise}}; box-shadow: {{t.shadow}}; opacity: {{ui.recentsOpacity}}; transform: {{ui.recentsY}}; pointer-events: {{ui.recentsPE}}; transition: opacity 0.26s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.25, 1);">
    <div style="font-family: 'Familjen Grotesk', ui-sans-serif, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{t.faint}}; padding: 6px 10px 8px;">Recientes</div>
    <sc-for list="{{recents}}" as="it" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 10px;">
        <div style="width: 32px; height: 32px; flex: 0 0 auto; border-radius: 11px; background: {{it.bg}}; display: flex; align-items: center; justify-content: center; color: {{it.glyph}};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="{{it.icon}}"></use></svg>
        </div>
        <div style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500;">{{it.name}}</div>
        <div style="font-size: 11px; color: {{t.faint}};">{{it.host}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; height: 84px; display: flex; align-items: center; padding: 0 14px; border-radius: 26px; background: {{t.raise}}; box-shadow: {{t.shadow}}; position: relative; z-index: 3;">

    <div style="width: {{ui.tilesW}}; flex: 0 0 auto; min-width: 0; overflow: hidden; transition: width 0.36s cubic-bezier(0.2, 0.8, 0.25, 1);">
      <div style="width: 258px; display: flex; gap: 10px; padding-right: 10px; opacity: {{ui.tilesOpacity}}; transition: opacity 0.2s ease;">
        <sc-for list="{{dock}}" as="d" hint-placeholder-count="4">
          <div style="flex: 1; height: 56px; border-radius: 18px; background: {{d.bg}}; display: flex; align-items: center; justify-content: center; color: {{d.glyph}};">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><use href="{{d.icon}}"></use></svg>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="width: {{ui.inputW}}; flex: 0 0 auto; min-width: 0; overflow: hidden; transition: width 0.36s cubic-bezier(0.2, 0.8, 0.25, 1);">
      <div style="width: 258px; padding-right: 10px; opacity: {{ui.inputOpacity}}; transition: opacity 0.24s ease 0.08s;">
        <div style="height: 56px; border-radius: 18px; background: {{t.field}}; display: flex; align-items: center; gap: 3px; padding: 0 16px;">
          <div style="width: 2px; height: 20px; border-radius: 1px; background: {{t.caret}}; animation: dc-blink 1.1s step-end infinite;"></div>
          <div style="font-size: 15px; color: {{t.faint}}; margin-left: 7px;">Buscar o abrir</div>
        </div>
      </div>
    </div>

    <div onClick="{{toggleSearch}}" style="width: 56px; height: 56px; flex: 0 0 auto; border-radius: 18px; background: {{ui.searchBg}}; display: flex; align-items: center; justify-content: center; color: {{ui.searchInk}}; cursor: pointer; position: relative; transition: background 0.26s ease;">
      <div style="position: absolute; display: flex; opacity: {{ui.iconSearch}}; transform: {{ui.iconSearchT}}; transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.25, 1);">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m15.8 15.8 4.7 4.7"></path></svg>
      </div>
      <div style="position: absolute; display: flex; opacity: {{ui.iconClose}}; transform: {{ui.iconCloseT}}; transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.25, 1);">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"></path></svg>
      </div>
    </div>

  </div>

  <div onClick="{{closeSettings}}" style="position: absolute; inset: 0; z-index: 5; background: {{t.scrim}}; opacity: {{ui.scrimOpacity}}; pointer-events: {{ui.scrimPE}}; transition: opacity 0.26s ease;"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 24px 26px; border-radius: 26px 26px 0 0; background: {{t.sheet}}; box-shadow: 0 -10px 40px {{t.sheetShadow}}; transform: {{ui.sheetY}}; transition: transform 0.36s cubic-bezier(0.2, 0.85, 0.25, 1);">
    <div style="width: 38px; height: 4px; border-radius: 2px; background: {{t.line}}; margin: 0 auto 16px;"></div>
    <div style="font-family: 'Familjen Grotesk', ui-sans-serif, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 18px;">Ajustes</div>
    <sc-for list="{{settingRows}}" as="row" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0;">
        <div style="font-size: 14px; font-weight: 500;">{{row.label}}</div>
        <div style="display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: {{t.segTrack}};">
          <sc-for list="{{row.opts}}" as="opt" hint-placeholder-count="3">
            <div onClick="{{opt.pick}}" style="min-width: 44px; height: 34px; display: flex; align-items: center; justify-content: center; padding: 0 12px; border-radius: 9px; font-size: 12.5px; font-weight: 500; cursor: pointer; background: {{opt.bg}}; color: {{opt.color}}; box-shadow: {{opt.shadow}}; transition: background 0.18s ease, color 0.18s ease;">{{opt.label}}</div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <svg width="0" height="0" style="position: absolute;" aria-hidden="true"><defs>
    <symbol id="mn-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3.5v3M16 3.5v3"></path></symbol>
    <symbol id="mn-cloud" viewBox="0 0 24 24"><path d="M7.5 19a4.5 4.5 0 0 1-.4-9 6 6 0 0 1 11.5 1.6A3.9 3.9 0 0 1 17.5 19z"></path></symbol>
    <symbol id="mn-img" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m4.6 17.6 4.1-4.1a2 2 0 0 1 2.8 0l4.9 4.9"></path></symbol>
    <symbol id="mn-doc" viewBox="0 0 24 24"><path d="M6.5 3.5h7L19 9v10.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-14A1.5 1.5 0 0 1 6.5 3.5z"></path><path d="M13.4 3.6V9H19M8.5 13.5h7M8.5 17h5"></path></symbol>
    <symbol id="mn-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"></rect><path d="M10 8.9 15.6 12 10 15.1z"></path></symbol>
    <symbol id="mn-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.6 12h16.8M12 3.5c2.3 2.4 3.5 5.3 3.5 8.5S14.3 18.1 12 20.5c-2.3-2.4-3.5-5.3-3.5-8.5S9.7 5.9 12 3.5z"></path></symbol>
    <symbol id="mn-pen" viewBox="0 0 24 24"><path d="m5 19 1.1-4.1L16.6 4.4a2.1 2.1 0 0 1 3 3L9.1 17.9z"></path><path d="m14.6 6.4 3 3"></path></symbol>
    <symbol id="mn-tv" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7"></path></symbol>
    <symbol id="mn-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></symbol>
    <symbol id="mn-list" viewBox="0 0 24 24"><path d="M9 7h10.5M9 12h10.5M9 17h6.5"></path><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"></path></symbol>
    <symbol id="mn-chat" viewBox="0 0 24 24"><path d="M20 12.2c0 3.7-3.6 6.7-8 6.7a9.6 9.6 0 0 1-2.6-.35L5 20l1.1-3.2A6.3 6.3 0 0 1 4 12.2C4 8.5 7.6 5.5 12 5.5s8 3 8 6.7z"></path></symbol>
    <symbol id="mn-code" viewBox="0 0 24 24"><path d="m9 8.4-4.2 3.7L9 15.8M15 8.4l4.2 3.7L15 15.8"></path></symbol>
    <symbol id="mn-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3.9 7.4 7 5a2 2 0 0 0 2.2 0l7-5"></path></symbol>
    <symbol id="mn-spark" viewBox="0 0 24 24"><path d="M12 3.5c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"></path></symbol>
    <symbol id="mn-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-6 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15 12 21 12 21z"></path><circle cx="12" cy="10.5" r="2.4"></circle></symbol>
    <symbol id="mn-music" viewBox="0 0 24 24"><path d="M9 17.3V6.9l10-2v10.2"></path><ellipse cx="6.5" cy="17.6" rx="2.5" ry="2.1"></ellipse><ellipse cx="16.5" cy="15.4" rx="2.5" ry="2.1"></ellipse></symbol>
    <symbol id="mn-film" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect><path d="M8 4.5v15M16 4.5v15M3 12h18"></path></symbol>
    <symbol id="mn-cart" viewBox="0 0 24 24"><path d="M3 4.5h2.3l2.2 9.6a1.8 1.8 0 0 0 1.8 1.4h7a1.8 1.8 0 0 0 1.8-1.4L20.5 8H6.2"></path><circle cx="10" cy="19.2" r="1.4"></circle><circle cx="17" cy="19.2" r="1.4"></circle></symbol>
  </defs></svg>

</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"view":{"editor":"enum","default":"grid","options":["grid","list"],"section":"Vista"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const dark = st.dark !== undefined ? st.dark : (this.props.dark ?? false);
    const view = st.view !== undefined ? st.view : (this.props.view ?? 'grid');
    const cols = st.cols !== undefined ? st.cols : 4;
    const labels = st.labels !== undefined ? st.labels : false;
    const searching = st.searching === true;
    const settings = st.settings === true;

    const t = dark
      ? { bg: '#191816', ink: '#F0EDE7', ink2: '#B6AFA5', faint: '#948D82', raise: '#242220',
          base: '#242220', field: '#1A1917', caret: '#7FD1C4', line: '#3A3630', sheet: '#211F1C',
          segTrack: '#2F2C28', segOn: '#413D37', scrim: 'rgba(0,0,0,0.5)', sheetShadow: 'rgba(0,0,0,0.5)',
          shadow: '0 2px 10px rgba(0,0,0,0.34)', tileShadow: '0 2px 8px rgba(0,0,0,0.28)', pill: '#332F2A' }
      : { bg: '#F4F2EE', ink: '#23211D', ink2: '#57524A', faint: '#7A736A', raise: '#FFFFFF',
          base: '#FFFFFF', field: '#EFEDE8', caret: '#2F7D77', line: '#DCD8D0', sheet: '#FBFAF8',
          segTrack: '#E8E4DC', segOn: '#FFFFFF', scrim: 'rgba(35,33,29,0.34)', sheetShadow: 'rgba(40,34,24,0.16)',
          shadow: '0 2px 12px rgba(40,34,24,0.07)', tileShadow: '0 1px 4px rgba(40,34,24,0.05)', pill: '#E6E2DA' };

    const wash = c => 'color-mix(in oklab, ' + c + ' ' + (dark ? 24 : 17) + '%, ' + t.base + ')';
    const glyph = c => dark
      ? 'color-mix(in oklab, ' + c + ' 58%, #F0EDE7)'
      : 'color-mix(in oklab, ' + c + ' 84%, #23211D)';
    const app = (name, host, icon, c) => ({ name, host, icon: '#mn-' + icon, bg: wash(c), glyph: glyph(c) });

    const all = [
      app('Calendario', 'google.com', 'cal', '#2F6FD0'), app('Drive', 'google.com', 'cloud', '#3D8BFD'),
      app('Fotos', 'google.com', 'img', '#E4572E'), app('Keep', 'google.com', 'doc', '#D9A116'),
      app('YouTube', 'youtube.com', 'play', '#C4302B'), app('Traductor', 'google.com', 'globe', '#1F7AE0'),
      app('Meet', 'google.com', 'tv', '#00897B'), app('Sheets', 'google.com', 'grid', '#1E8E3E'),
      app('Figma', 'figma.com', 'pen', '#A259FF'), app('Notion', 'notion.so', 'doc', '#6B6B6B'),
      app('Linear', 'linear.app', 'list', '#5E6AD2'), app('GitHub', 'github.com', 'code', '#3A3F45'),
      app('Trello', 'trello.com', 'grid', '#0079BF'), app('Canva', 'canva.com', 'img', '#00C4CC'),
      app('Spotify', 'spotify.com', 'music', '#1DB954'), app('Netflix', 'netflix.com', 'film', '#E50914'),
      app('Twitch', 'twitch.tv', 'tv', '#9146FF'), app('Amazon', 'amazon.com', 'cart', '#E08A00'),
      app('Excalidraw', 'excalidraw.com', 'pen', '#6965DB')
    ];
    const dock = [
      app('Gmail', 'google.com', 'mail', '#D14836'), app('WhatsApp', 'whatsapp.com', 'chat', '#1FA855'),
      app('Claude', 'claude.ai', 'spark', '#C96442'), app('Maps', 'google.com', 'pin', '#1A9E5F')
    ];

    const seg = (value, current) => opt => ({
      label: opt.label,
      bg: opt.v === current ? t.segOn : 'transparent',
      color: opt.v === current ? t.ink : t.faint,
      shadow: opt.v === current ? t.shadow : 'none',
      pick: () => this.setState({ [value]: opt.v })
    });
    const mk = (key, current, opts) => opts.map(seg(key, current));

    const settingRows = [
      { label: 'Vista', opts: mk('view', view, [{ v: 'grid', label: 'Cuadrícula' }, { v: 'list', label: 'Lista' }]) },
      { label: 'Columnas', opts: mk('cols', cols, [{ v: 3, label: '3' }, { v: 4, label: '4' }, { v: 5, label: '5' }]) },
      { label: 'Etiquetas', opts: mk('labels', labels, [{ v: false, label: 'No' }, { v: true, label: 'Sí' }]) },
      { label: 'Tema', opts: mk('dark', dark, [{ v: false, label: 'Claro' }, { v: true, label: 'Oscuro' }]) }
    ];

    const ui = {
      tilesW: searching ? '0px' : '258px',
      inputW: searching ? '258px' : '0px',
      tilesOpacity: searching ? '0' : '1',
      inputOpacity: searching ? '1' : '0',
      searchBg: searching ? t.ink : wash('#2F7D77'),
      searchInk: searching ? t.bg : glyph('#2F7D77'),
      iconSearch: searching ? '0' : '1',
      iconClose: searching ? '1' : '0',
      iconSearchT: searching ? 'rotate(-90deg) scale(0.7)' : 'rotate(0deg) scale(1)',
      iconCloseT: searching ? 'rotate(0deg) scale(1)' : 'rotate(90deg) scale(0.7)',
      contentOpacity: searching ? '0.35' : '1',
      contentScale: searching ? 'scale(0.985)' : 'scale(1)',
      recentsOpacity: searching ? '1' : '0',
      recentsY: searching ? 'translateY(0px)' : 'translateY(14px)',
      recentsPE: searching ? 'auto' : 'none',
      scrimOpacity: settings ? '1' : '0',
      scrimPE: settings ? 'auto' : 'none',
      sheetY: settings ? 'translateY(0%)' : 'translateY(105%)',
      gearBg: settings ? t.ink : t.raise,
      gearInk: settings ? t.bg : t.ink2,
      rowGap: labels ? '18px' : '24px',
      labelDisplay: labels ? 'block' : 'none'
    };

    const visible = all.slice(0, cols * 5 - 1);
    const diario = all.slice(0, 5);
    const crear = all.slice(8, 12);

    return {
      t, ui, dock, settingRows,
      apps: visible,
      recents: [all[8], dock[0], all[10]],
      groups: [
        { name: 'Diario', count: String(diario.length), rows: diario },
        { name: 'Crear', count: String(crear.length), rows: crear }
      ],
      folderDots: ['#6B6B6B', '#7C3E7E', '#5E6AD2', '#00897B'].map(c => ({
        c: 'color-mix(in oklab, ' + c + ' ' + (dark ? 52 : 38) + '%, ' + t.base + ')'
      })),
      tabs: [
        { name: 'Diario', bg: t.ink, color: t.bg },
        { name: 'Crear', bg: t.pill, color: t.ink2 },
        { name: 'Ocio', bg: t.pill, color: t.ink2 }
      ],
      isGrid: view === 'grid',
      isList: view === 'list',
      gridCols: 'repeat(' + cols + ', minmax(0, 1fr))',
      toggleSearch: () => this.setState({ searching: !searching }),
      openSettings: () => this.setState({ settings: true, searching: false }),
      closeSettings: () => this.setState({ settings: false })
    };
  }
}
</script>
</body>
</html>
