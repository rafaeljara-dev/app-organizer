<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; }
    a { color: #8a5a2b; } a:hover { color: #6d4520; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; padding: 30px 26px 26px; background: {{t.bg}}; color: {{t.ink}}; overflow: hidden;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 25px; line-height: 1; letter-spacing: -0.01em;">Estante</div>
      <div style="font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: {{t.faint}};">15 apps · 3 páginas</div>
    </div>
    <div style="display: flex; gap: 4px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.ink2}};">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.ink2}};">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"></path></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 22px; padding-bottom: 11px; border-bottom: 1px solid {{t.line}}; color: {{t.faint}};">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m15.8 15.8 4.7 4.7"></path></svg>
    <span style="font-size: 14px;">Buscar o abrir</span>
  </div>

  <div style="display: flex; gap: 20px; margin-top: 24px; align-items: baseline;">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <div style="font-size: 13px; font-weight: {{tab.w}}; color: {{tab.color}}; padding-bottom: 5px; border-bottom: 1.5px solid {{tab.rule}};">{{tab.name}}</div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: {{gridCols}}; gap: 30px 10px; margin-top: 30px;">
    <sc-for list="{{apps}}" as="it" hint-placeholder-count="14">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
        <div style="width: 100%; aspect-ratio: 1; max-width: 58px; border: 1px solid {{t.line}}; border-radius: 15px; background: {{t.tile}}; display: flex; align-items: center; justify-content: center; color: {{it.glyph}};">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><use href="{{it.icon}}"></use></svg>
        </div>
        <div style="font-size: 10.5px; line-height: 1.2; text-align: center; color: {{t.ink2}}; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{it.name}}</div>
      </div>
    </sc-for>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
      <div style="width: 100%; aspect-ratio: 1; max-width: 58px; border: 1px solid {{t.line}}; border-radius: 15px; background: {{t.tile}}; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 15px;">
        <sc-for list="{{folderDots}}" as="d" hint-placeholder-count="4">
          <div style="border-radius: 3px; background: {{d.c}};"></div>
        </sc-for>
      </div>
      <div style="font-size: 10.5px; line-height: 1.2; text-align: center; color: {{t.ink2}};">Trabajo</div>
    </div>
  </div>

  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid {{t.line}}; display: flex; justify-content: space-between;">
    <sc-for list="{{dock}}" as="d" hint-placeholder-count="4">
      <div style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; color: {{d.glyph}};">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><use href="{{d.icon}}"></use></svg>
      </div>
    </sc-for>
  </div>

  <svg width="0" height="0" style="position: absolute;" aria-hidden="true"><defs>
    <symbol id="pp-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3.5v3M16 3.5v3"></path></symbol>
    <symbol id="pp-cloud" viewBox="0 0 24 24"><path d="M7.5 19a4.5 4.5 0 0 1-.4-9 6 6 0 0 1 11.5 1.6A3.9 3.9 0 0 1 17.5 19z"></path></symbol>
    <symbol id="pp-img" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m4.6 17.6 4.1-4.1a2 2 0 0 1 2.8 0l4.9 4.9"></path></symbol>
    <symbol id="pp-doc" viewBox="0 0 24 24"><path d="M6.5 3.5h7L19 9v10.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-14A1.5 1.5 0 0 1 6.5 3.5z"></path><path d="M13.4 3.6V9H19M8.5 13.5h7M8.5 17h5"></path></symbol>
    <symbol id="pp-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"></rect><path d="M10 8.9 15.6 12 10 15.1z"></path></symbol>
    <symbol id="pp-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.6 12h16.8M12 3.5c2.3 2.4 3.5 5.3 3.5 8.5S14.3 18.1 12 20.5c-2.3-2.4-3.5-5.3-3.5-8.5S9.7 5.9 12 3.5z"></path></symbol>
    <symbol id="pp-pen" viewBox="0 0 24 24"><path d="m5 19 1.1-4.1L16.6 4.4a2.1 2.1 0 0 1 3 3L9.1 17.9z"></path><path d="m14.6 6.4 3 3"></path></symbol>
    <symbol id="pp-tv" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7"></path></symbol>
    <symbol id="pp-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></symbol>
    <symbol id="pp-list" viewBox="0 0 24 24"><path d="M9 7h10.5M9 12h10.5M9 17h6.5"></path><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"></path></symbol>
    <symbol id="pp-chat" viewBox="0 0 24 24"><path d="M20 12.2c0 3.7-3.6 6.7-8 6.7a9.6 9.6 0 0 1-2.6-.35L5 20l1.1-3.2A6.3 6.3 0 0 1 4 12.2C4 8.5 7.6 5.5 12 5.5s8 3 8 6.7z"></path></symbol>
    <symbol id="pp-code" viewBox="0 0 24 24"><path d="m9 8.4-4.2 3.7L9 15.8M15 8.4l4.2 3.7L15 15.8"></path></symbol>
    <symbol id="pp-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3.9 7.4 7 5a2 2 0 0 0 2.2 0l7-5"></path></symbol>
    <symbol id="pp-spark" viewBox="0 0 24 24"><path d="M12 3.5c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"></path></symbol>
    <symbol id="pp-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-6 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15 12 21 12 21z"></path><circle cx="12" cy="10.5" r="2.4"></circle></symbol>
    <symbol id="pp-music" viewBox="0 0 24 24"><path d="M9 17.3V6.9l10-2v10.2"></path><ellipse cx="6.5" cy="17.6" rx="2.5" ry="2.1"></ellipse><ellipse cx="16.5" cy="15.4" rx="2.5" ry="2.1"></ellipse></symbol>
  </defs></svg>

</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"cols":{"editor":"int","default":4,"min":3,"max":5,"section":"Cuadrícula"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const cols = this.props.cols ?? 4;
    const t = dark
      ? { bg: '#1C1A17', ink: '#EDE9E2', ink2: '#B4ADA2', faint: '#948C80', line: '#332F2A', tile: '#232019', accent: '#C79A52' }
      : { bg: '#FBFAF7', ink: '#23201C', ink2: '#4E4941', faint: '#7B746A', line: '#E3DFD6', tile: '#FFFFFF', accent: '#A9772F' };

    const mix = (c, p) => 'color-mix(in oklab, ' + c + ' ' + p + '%, ' + t.ink + ')';
    const app = (name, icon, c) => ({ name, icon: '#pp-' + icon, glyph: mix(c, dark ? 80 : 72) });

    const apps = [
      app('Calendario', 'cal', '#2F6FD0'), app('Drive', 'cloud', '#3D8BFD'),
      app('Fotos', 'img', '#E4572E'), app('Keep', 'doc', '#D9A116'),
      app('YouTube', 'play', '#C4302B'), app('Traductor', 'globe', '#1F7AE0'),
      app('Excalidraw', 'pen', '#6965DB'), app('Meet', 'tv', '#00897B'),
      app('Sheets', 'grid', '#1E8E3E'), app('Notion', 'doc', '#6B6B6B'),
      app('Trello', 'grid', '#0079BF'), app('Slack', 'chat', '#7C3E7E'),
      app('Linear', 'list', '#5E6AD2'), app('tldraw', 'code', '#2F80ED')
    ];
    const dock = [
      app('Gmail', 'mail', '#D14836'), app('WhatsApp', 'chat', '#1FA855'),
      app('Claude', 'spark', '#C96442'), app('Maps', 'pin', '#1A9E5F')
    ];
    const tabs = [
      { name: 'Diario', w: 600, color: t.ink, rule: t.accent },
      { name: 'Crear', w: 400, color: t.faint, rule: 'transparent' },
      { name: 'Ocio', w: 400, color: t.faint, rule: 'transparent' }
    ];
    const folderDots = ['#6B6B6B', '#7C3E7E', '#5E6AD2', '#00897B'].map(c => ({ c: mix(c, dark ? 62 : 52) }));

    return { t, apps, dock, tabs, folderDots, gridCols: 'repeat(' + cols + ', minmax(0, 1fr))' };
  }
}
</script>
</body>
</html>
