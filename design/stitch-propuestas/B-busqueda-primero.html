<!-- Micro-interaction script for ergonomic keyboard shortcut '/' and spotlight focus -->
<script>
    document.addEventListener('keydown', (e) => {
      // Raycast / Spotlight quick activation with '/'
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        const searchInput = document.getElementById('spotlight-input');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }
      // Escape to blur search
      if (e.key === 'Escape' && document.activeElement.id === 'spotlight-input') {
        document.activeElement.blur();
      }
    });
  </script>
